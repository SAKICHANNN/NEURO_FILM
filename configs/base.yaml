# K-MCFM V3 Base Configuration
# Diffusion-based film translation: SDEdit + LoRA + IP-Adapter

project:
  name: K-MCFM
  version: 3.0
  description: Diffusion-Based Film Translation

hardware:
  cuda:
    device: cuda
    gpu: RTX 5070 Ti Laptop
    vram_total_mb: 12227
  mac:
    device: mps
    mlx_enabled: true

precision:
  training: fp16-mixed
  inference: float16

paths:
  data_root: data
  film_domain_root: data/film_domain
  loras_root: loras
  checkpoints_root: checkpoints
  outputs_root: outputs

inference:
  resolution: 1024
  num_inference_steps: 30
  guidance_scale: 7.5
  strength: 0.45

training:
  resolution: 1024
  batch_size: 1
  gradient_accumulation_steps: 4
  max_train_steps: 2000
  learning_rate: 1e-4
  rank: 16
  lora_alpha: 16
  optimizer: adamw8bit
  gradient_checkpointing: true

modules:
  lora: true
  ip_adapter: false
  controlnet: false
  grain_post: false
  halation_post: false

logging:
  use_wandb: false
  use_tensorboard: true
  log_every_n_steps: 50
  save_every_n_steps: 500
