# Kodak Vision3 500T — Tungsten-balanced color negative motion picture film
name: "Kodak Vision3 500T"
short_name: "vision3_500t"
film_type: "negative_color_motion"
iso: 500
white_balance: "tungsten"

hd_curve:
  csv_path: "data/physics/kodak_vision3_500t/hd_curve.csv"
  r: {toe: -2.4, linear_shoulder: 0.8, gamma: 0.55, dmax: 3.2}
  g: {toe: -2.3, linear_shoulder: 0.7, gamma: 0.54, dmax: 3.1}
  b: {toe: -2.0, linear_shoulder: 0.5, gamma: 0.50, dmax: 2.8}

grain:
  rms_granularity: 5.0
  shadow_power: 0.8
  midtone_power: 0.6
  highlight_power: 0.3

halation:
  r_sigma: 0.6
  g_sigma: 0.3
  b_sigma: 0.15
  threshold: 0.85

color:
  method: "cut"
  model_path: null
