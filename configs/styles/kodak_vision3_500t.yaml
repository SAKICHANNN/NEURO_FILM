# @package style
name: "Kodak Vision3 500T"
short_name: "vision3_500t"
film_type: "negative_color_motion"
iso: 500
white_balance: "tungsten"

hd_curve:
  r: {toe: -2.4, linear_shoulder: 0.8, gamma: 0.55, dmax: 3.2}
  g: {toe: -2.3, linear_shoulder: 0.7, gamma: 0.54, dmax: 3.1}
  b: {toe: -2.0, linear_shoulder: 0.5, gamma: 0.50, dmax: 2.8}

spectral_sensitivity:
  r_peak: 620
  g_peak: 540
  b_peak: 450
  r_width: 100
  g_width: 90
  b_width: 60

grain:
  rms_granularity: 5.0
  coarseness: 0.6
  color_correlation: 0.25

halation:
  scatter_intensity: [0.15, 0.08, 0.03]
  scatter_radius: [21.0, 13.0, 7.0]

dir:
  strength: 0.3
  diffusion_radius: 1.5
  edge_threshold: 0.1

lora:
  rank: 16
  alpha: 16
