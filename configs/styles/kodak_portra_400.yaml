# Kodak Portra 400 — Fine-grain color negative still film
name: "Kodak Portra 400"
short_name: "portra_400"
film_type: "negative_color_still"
iso: 400
white_balance: "daylight"

hd_curve:
  csv_path: "data/physics/kodak_portra_400/hd_curve.csv"
  r: {toe: -2.2, linear_shoulder: 0.7, gamma: 0.58, dmax: 3.0}
  g: {toe: -2.1, linear_shoulder: 0.7, gamma: 0.57, dmax: 2.9}
  b: {toe: -1.9, linear_shoulder: 0.6, gamma: 0.55, dmax: 2.7}

grain:
  rms_granularity: 10.0
  shadow_power: 0.4
  midtone_power: 0.3
  highlight_power: 0.15

halation:
  r_sigma: 0.4
  g_sigma: 0.2
  b_sigma: 0.1
  threshold: 0.88

color:
  method: "cut"
  model_path: null
