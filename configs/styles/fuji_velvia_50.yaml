# Fujifilm Velvia 50 — High-saturation color reversal (slide) film
name: "Fujifilm Velvia 50"
short_name: "velvia_50"
film_type: "positive_color_slide"
iso: 50
white_balance: "daylight"

hd_curve:
  csv_path: "data/physics/fuji_velvia_50/hd_curve.csv"
  r: {toe: -2.6, linear_shoulder: 1.0, gamma: 0.70, dmax: 3.5}
  g: {toe: -2.5, linear_shoulder: 1.0, gamma: 0.68, dmax: 3.4}
  b: {toe: -2.3, linear_shoulder: 0.9, gamma: 0.65, dmax: 3.2}

grain:
  rms_granularity: 3.0
  shadow_power: 0.2
  midtone_power: 0.1
  highlight_power: 0.05

halation:
  r_sigma: 0.2
  g_sigma: 0.1
  b_sigma: 0.05
  threshold: 0.92

color:
  method: "cut"
  model_path: null
