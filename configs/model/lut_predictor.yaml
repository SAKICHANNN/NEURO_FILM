# 3D LUT Color Transfer Training Config (Backup Option)
# Image-Adaptive-3DLUT: Zeng et al., TPAMI 2021

model:
  input_size: 256
  lut_dim: 33          # 33^3 = 35937 entries
  n_basis_luts: 3
  backbone: resnet18

training:
  batch_size: 16
  lr: 0.0001
  n_epochs: 300
  lr_policy: cosine

pretrained:
  fivek_luts: null     # path to pretrained FiveK LUT weights
  fivek_classifier: null
