# @package model
cfm:
  method: "ot"          # independent | ot | target | schrodinger | vp
  sigma: 1.0e-5
  ot_method: "exact"    # exact | sinkhorn

  velocity_net:
    embed_dim: 256
    latent_channels: 4
    backbone: "mamba_tiny"

  ode:
    method: "dopri5"    # dopri5 | rk4 | euler | midpoint
    atol: 1.0e-5
    rtol: 1.0e-5
    n_steps: 50

  time_schedule: "uniform"  # uniform | cosine | exponential

training:
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  max_steps: 200000
  warmup_steps: 5000
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  ema_decay: 0.9999
