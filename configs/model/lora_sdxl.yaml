# SDXL LoRA Training Config
# kohya-ss / diffusers train_text_to_image_lora_sdxl

model:
  pretrained: stabilityai/stable-diffusion-xl-base-1.0
  variant: fp16
  cache_dir: null

dataset:
  image_column: image
  caption_column: text
  resolution: 1024
  center_crop: true
  random_flip: true

lora:
  rank: 16
  alpha: 16
  target_modules: ["to_q", "to_k", "to_v", "to_out.0"]
  init_lora_weights: gaussian

training:
  output_dir: loras/
  train_batch_size: 1
  gradient_accumulation_steps: 4
  max_train_steps: 2000
  learning_rate: 1e-4
  lr_scheduler: cosine
  lr_warmup_steps: 100
  mixed_precision: fp16
  gradient_checkpointing: true
  max_grad_norm: 1.0

validation:
  validation_prompt: "a cinematic photograph shot on [FILM_NAME], film grain, analog photography"
  validation_steps: 200
