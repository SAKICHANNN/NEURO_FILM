# @package model
vae:
  latent_channels: 4
  block_out_channels: [64, 128, 256, 512]
  layers_per_block: 2
  attention_resolutions: [16]
  dropout: 0.0
  kl_weight: 0.000001
  perceptual_loss_weight: 1.0
  adversarial_loss_weight: 0.5
  discriminator_start_step: 50000

training:
  phase_a:
    steps: 50000
    lr: 1.0e-4
    batch_size: 4
    resolution: 256
    losses: [l1, lpips]
  phase_b:
    steps: 100000
    lr_start: 1.0e-4
    lr_end: 5.0e-5
    kl_warmup_steps: 20000
    losses: [l1, lpips, kl, gan]
  phase_c:
    steps: 100000
    resolution: 512
    batch_size: 1
    gradient_accumulation: 4
    losses: [l1, lpips, kl, gan]
