# CUT (Contrastive Unpaired Translation) Training Config
# Park et al., ECCV 2020

model:
  name: cut
  generator: resnet_9blocks
  discriminator: patchgan_70x70
  input_nc: 3
  output_nc: 3
  ngf: 64
  ndf: 64
  n_layers_D: 3
  norm: instance
  no_dropout: false
  init_type: normal
  init_gain: 0.02

contrastive:
  nce_layers: [0, 4, 8, 12, 16]
  nce_idt: true
  lambda_NCE: 1.0
  lambda_identity: 1.0
  nce_T: 0.07
  num_patches: 256

training:
  batch_size: 1
  load_size: 286
  crop_size: 256
  lr: 0.0002
  beta1: 0.5
  n_epochs: 200
  n_epochs_decay: 200
  lr_policy: linear
  gan_mode: lsgan
  pool_size: 50
  serial_batches: false
