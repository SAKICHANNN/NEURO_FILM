# @package training
phase: "rtx3060_optimize"
resume: null
checkpoint: "checkpoints/cfm/model.pt"

optimization:
  fp8: false
  flash_attention: true
  gradient_checkpointing: true
  use_8bit_adam: true
  compile: false
  channels_last: true

inference:
  n_steps_stage1: 3
  n_steps_stage2: 4
  tile_size: 512
  target_time_ms: 5000

profiling:
  enabled: true
  trace_memory: true
  trace_latency: true
