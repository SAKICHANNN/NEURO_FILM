# @package training
phase: "physics_finetune"
resume: null
cfm_checkpoint: "checkpoints/cfm/model.pt"
vae_checkpoint: "checkpoints/vae/model.pt"

model:
  kan: "configs/model/kan_physics.yaml"

data:
  train: "configs/data/paired.yaml"

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  lr_scheduler: "cosine"
  warmup_steps: 1000
  max_steps: 50000
  max_grad_norm: 1.0
  ema_decay: 0.9999
  precision: "bf16-mixed"

physics_losses:
  hd_rmse_weight: 1.0
  dir_corr_weight: 0.5
  nps_mse_weight: 0.5
  delta_e_weight: 1.0
  histogram_emd_weight: 0.3

validation:
  every_n_steps: 2000
  num_val_samples: 8
  metrics: [fid, lpips, hd_rmse, nps_corr, delta_e]
