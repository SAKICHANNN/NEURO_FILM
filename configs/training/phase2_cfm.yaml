# @package training
phase: "cfm_pretrain"
resume: null
vae_checkpoint: "checkpoints/vae/model.pt"

model:
  cfm: "configs/model/cfm_base.yaml"
  mamba: "configs/model/mamba_tiny.yaml"

data:
  train: "configs/data/paired.yaml"

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  lr_scheduler: "cosine"
  warmup_steps: 5000
  max_steps: 200000
  max_grad_norm: 1.0
  ema_decay: 0.9999
  precision: "bf16-mixed"

validation:
  every_n_steps: 5000
  num_val_samples: 16
  metrics: [fid, lpips, psnr]
