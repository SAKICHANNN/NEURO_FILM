# @package training
phase: "vae_pretrain"
resume: null

model:
  vae: "configs/model/vae_tiny.yaml"

data:
  train: "configs/data/paired.yaml"
  val: "configs/data/paired.yaml"

training:
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  lr_scheduler: "cosine"
  warmup_steps: 5000
  max_steps: 250000
  max_grad_norm: 1.0
  ema_decay: 0.9999
  precision: "bf16-mixed"

validation:
  every_n_steps: 5000
  num_val_samples: 16
  metrics: [psnr, ssim, lpips]
